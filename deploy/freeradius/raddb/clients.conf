# RADIUS クライアント定義
#
# 本番想定: Cisco Catalyst 9800-CL (WLC) のみを許可。
# 共有鍵は .env の WLC_SHARED_SECRET から渡される。
# 構成図上 WLC は VLAN100 WMI (10.98.38.4/32) を RADIUS source として送信する想定。

client wlc-catalyst-9800-cl {
    ipaddr   = 10.98.38.4/32
    secret   = ${ENV[WLC_SHARED_SECRET]}
    nas_type = cisco
    # Cisco IOS-XE 17.x 系のセキュリティアップデート以降 Message-Authenticator が必須化される
    # 傾向にあるため有効化。Cisco 側のテンプレートに `message-authenticator` を含めること。
    require_message_authenticator = yes
}

# テスト用ループバック (radtest / eapol_test を FreeRADIUS コンテナ内から実行する用)
# 本番展開時に削除またはコメントアウト可。Portal API への rlm_rest 認証は別パス (HTTPS + Bearer) なので影響なし。
client testing-localhost {
    ipaddr   = 127.0.0.1
    secret   = testing123
    nas_type = other
    require_message_authenticator = no
}
